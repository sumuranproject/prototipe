<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F5132" />
  <title>SakuKasir</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <section id="view-login" class="view active">
    <div class="login-wrap">
      <div class="login-brand">
        <div class="brand-mark">SK</div>
        <h1>SakuKasir</h1>
        <p class="muted">Point of Sale untuk usaha kamu</p>
      </div>
      <form id="login-form" class="card login-card">
        <label class="field">
          <span>Username</span>
          <input type="text" id="login-user" autocomplete="username" placeholder="owner / kasir" required />
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" id="login-pass" autocomplete="current-password" required />
        </label>
        <p class="hint">Demo: <b>owner</b> atau <b>kasir</b> · password bebas</p>
        <div id="login-error" class="form-error" hidden></div>
        <button type="submit" class="btn btn-primary btn-block">Masuk</button>
        <div class="login-links">
          <button type="button" class="btn-link" id="show-register">Daftar sebagai Owner</button>
          <button type="button" class="btn-link" id="show-forgot">Lupa password?</button>
        </div>
      </form>
    </div>
  </section>

  <!-- ============ REGISTER (2 tahap) ============ -->
  <section id="view-register" class="view">
    <div class="login-wrap">
      <div class="login-brand">
        <div class="brand-mark">SK</div>
        <h1>Daftar Owner</h1>
        <p class="muted" id="register-step-label">Tahap 1 dari 2</p>
      </div>
      <form id="register-form" class="card login-card">
        <div id="register-step-1">
          <div class="step-dots"><span class="active"></span><span></span></div>
          <label class="field"><span>Username</span><input type="text" id="reg-username" required /></label>
          <label class="field"><span>Email</span><input type="email" id="reg-email" required /></label>
          <label class="field"><span>Password</span><input type="password" id="reg-password" minlength="6" required /></label>
          <label class="field"><span>Nama tampilan</span><input type="text" id="reg-displayname" required /></label>
          <button type="submit" class="btn btn-primary btn-block">Lanjut</button>
        </div>
        <div id="register-step-2" hidden>
          <div class="step-dots"><span class="done"></span><span class="active"></span></div>
          <label class="field"><span>Nama bisnis</span><input type="text" id="reg-bizname" required /></label>
          <label class="field"><span>Tipe bisnis</span>
            <select id="reg-biztype" required>
              <option value="">Pilih tipe</option>
              <option>Kafe / Coffee Shop</option>
              <option>Restoran</option>
              <option>Warung / Kelontong</option>
              <option>Retail</option>
              <option>Jasa</option>
              <option>Lainnya</option>
            </select>
          </label>
          <label class="field"><span>Nomor kontak (opsional)</span><input type="tel" id="reg-phone" /></label>
          <div style="display:flex;gap:8px">
            <button type="button" class="btn btn-ghost" id="reg-back">Kembali</button>
            <button type="submit" class="btn btn-primary" style="flex:1">Daftar</button>
          </div>
        </div>
      </form>
      <button type="button" class="btn-link" id="reg-cancel">Kembali ke login</button>
    </div>
  </section>

  <!-- ============ FORGOT PASSWORD ============ -->
  <section id="view-forgot" class="view">
    <div class="login-wrap">
      <div class="login-brand">
        <div class="brand-mark">SK</div>
        <h1>Lupa password</h1>
        <p class="muted">Link reset akan dikirim ke email kamu</p>
      </div>
      <form id="forgot-form" class="card login-card">
        <label class="field"><span>Email terdaftar</span><input type="email" id="forgot-email" required /></label>
        <button type="submit" class="btn btn-primary btn-block">Kirim link reset</button>
      </form>
      <button type="button" class="btn-link" id="forgot-cancel">Kembali ke login</button>
    </div>
  </section>

  <!-- ============ APP SHELL ============ -->
  <section id="view-app" class="view">
    <header class="app-header">
      <div class="header-left">
        <div class="brand-mark small" id="brand-mark" role="button" tabindex="0" title="Buka menu kelola">SK</div>
        <button class="outlet-chip" id="outlet-chip">
          <span id="outlet-name">Toko Berkah</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="sync-indicator" title="Status sinkronisasi">
          <span class="sync-dot" data-status="synced"></span>
        </button>
        <button class="icon-btn" id="printer-indicator" title="Printer Bluetooth">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        </button>
        <button class="icon-btn" id="notif-btn" title="Notifikasi">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="badge-dot" id="notif-dot"></span>
        </button>
        <button class="icon-btn" id="theme-btn" title="Ganti tema">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <button class="icon-btn" id="logout-btn" title="Keluar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </header>

    <div id="offline-banner" class="offline-banner" hidden>
      <span class="sync-dot" data-status="pending"></span>
      <span id="offline-text">Mode offline</span>
      <button class="btn-link" id="sync-now-inline">Sync sekarang</button>
    </div>

    <main id="main" class="app-main"></main>
    <nav class="bottom-nav" id="bottom-nav"></nav>
  </section>

  <!-- ============ SIDEBAR (Kelola) ============ -->
  <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
  <aside id="sidebar" class="sidebar" hidden>
    <div class="sidebar-header">
      <div class="brand-mark small" style="cursor:default">SK</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:15px">Kelola</div>
        <div class="muted small">Menu owner</div>
      </div>
      <button class="icon-btn" id="sidebar-close" title="Tutup">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="sidebar-body" id="sidebar-body"></div>
  </aside>

  <!-- ============ SHEET HOST ============ -->
  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>

  <!-- ============ TOAST HOST ============ -->
  <div id="toast-host" class="toast-host"></div>

  <!-- ============ MODAL HOST ============ -->
  <div id="modal-host"></div>
  <div id="receipt-host"></div>

  <script src="app.js"></script>
</body>
</html>
