<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SakuKasir Gallery</title>
  <style>
    body { margin: 0; padding: 0; background: #eee; font-family: sans-serif; }
    h1 { font-size: 16px; padding: 12px; margin: 0; background: #0F5132; color: #fff; }
    .item { margin: 10px; background: #fff; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; }
    .label { padding: 6px 10px; background: #0F5132; color: #fff; font-size: 12px; font-weight: 600; }
    iframe { width: 390px; border: 0; display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <h1>SakuKasir Gallery · Full Content</h1>
  <div id="grid"></div>
  <script>
    var SCREENS = [
      'login','register','forgot','setup',
      'owner-pos','owner-pos-cart','owner-checkout',
      'owner-reports','owner-reports-expenses','owner-reports-summary',
      'manage','manage-products','manage-categories','manage-inventory',
      'manage-outlets','manage-workers','manage-qris','manage-printer',
      'manage-receipt','manage-notif','manage-sync','manage-security',
      'manage-audit','manage-theme','manage-profile','manage-about',
      'kasir-dashboard','kasir-pos','kasir-transactions','kasir-shift',
      'modal-void','modal-refund','sheet-checkout','modal-confirm','success'
    ];

    var grid = document.getElementById('grid');

    SCREENS.forEach(function(name) {
      var div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = '<div class="label">' + name + '</div>' +
        '<iframe src="index.html?screen=' + name + '" scrolling="no"></iframe>';
      grid.appendChild(div);
    });

    // Setelah iframe load, ukur tinggi konten & set tinggi iframe
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.querySelectorAll('iframe').forEach(function(f) {
          try {
            // Tambah delay kecil biar app.js selesai render
            setTimeout(function() {
              var doc = f.contentDocument || f.contentWindow.document;
              var h = Math.max(
                doc.body.scrollHeight,
                doc.documentElement.scrollHeight,
                doc.body.offsetHeight,
                doc.documentElement.offsetHeight
              );
              f.style.height = h + 'px';
            }, 500);
          } catch (e) {
            console.warn('Cannot measure iframe:', e);
          }
        });
      }, 1500); // tunggu semua app.js di iframe selesai init
    });
  </script>
</body>
</html>
